# Database servers for the integration tests: npm run test:integration
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test
    ports:
      - '127.0.0.1:33306:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ptest']
      interval: 2s
      retries: 60

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: test
    ports:
      - '127.0.0.1:33307:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      retries: 60
