appId: com.romainlavabre.simone
productName: Simone
executableName: simone
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
# Run by the app to install an update of its AppImage.
extraResources:
  - install.sh
asarUnpack:
  - '**/*.node'
linux:
  target:
    - AppImage
    - deb
  category: Development
  syncDesktopName: true
  icon: build/icon.png
  maintainer: Romain Lavabre
  synopsis: Fast MySQL / MariaDB client with git-shared connections and queries
deb:
  depends:
    - git
    - openssh-client
  # The package was called mysql-client-gui until 1.0.0: installing simone removes it.
  fpm:
    - --replaces=mysql-client-gui
    - --conflicts=mysql-client-gui
artifactName: ${name}-${version}-${arch}.${ext}
